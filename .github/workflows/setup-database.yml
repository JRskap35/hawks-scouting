# Run setup tasks from the Actions tab, no local install needed.
#   Actions > Set up database > Run workflow > pick a task.
# The output also appears on the run's summary page.

name: Set up database

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options:
          - Check Baseball Reference
          - Create tables
          - First load
          - Check the league site
        default: Check Baseball Reference
      season:
        description: Stats season (leave blank for the latest)
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120          # the first load reads every player's page at 3.5 seconds each
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
      SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the database secret
        if: inputs.task == 'Create tables' || inputs.task == 'First load'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          # The direct connection (db.<ref>.supabase.co) is IPv6 only, and GitHub's servers cannot reach it.
          if echo "$DATABASE_URL" | grep -Eq '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::DATABASE_URL is the Direct connection string. In Supabase click Connect, choose Session pooler, and save that string instead (its host ends in pooler.supabase.com)."
            exit 1
          fi
          if echo "$DATABASE_URL" | grep -q 'YOUR-PASSWORD'; then
            echo "::error::DATABASE_URL still contains [YOUR-PASSWORD]. Replace it, brackets included, with your database password."
            exit 1
          fi
          if echo "$DATABASE_URL" | grep -Eq ':\[|\]@'; then
            echo "::error::DATABASE_URL has square brackets around the password. Remove the [ and ] so it reads ...:yourpassword@..."
            exit 1
          fi

      - name: ${{ inputs.task }}
        run: |
          case "${{ inputs.task }}" in
            "Check Baseball Reference") cmd="python cli.py bref-check ${SEASON:+--season $SEASON}" ;;
            "Create tables")            cmd="python cli.py init-db" ;;
            "First load")               cmd="python cli.py bref ${SEASON:+--season $SEASON}" ;;
            "Check the league site")    cmd="python cli.py check-site ${SEASON:+--season $SEASON}" ;;
          esac
          echo "Running: $cmd"
          set -o pipefail
          $cmd 2>&1 | tee output.txt
          {
            echo "### ${{ inputs.task }}"
            echo '```'
            tail -c 60000 output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
