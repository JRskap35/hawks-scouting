# Loads the transaction pages pasted into data/transactions/<season>.txt.
# Runs whenever one of those files is saved, or by hand from the Actions tab.

name: Load pasted transactions

on:
  push:
    branches: [main]
    paths: ["data/transactions/*.txt"]
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load transactions
        run: |
          set -o pipefail
          python cli.py transactions-file 2>&1 | tee output.txt
          { echo '### Pasted transactions'; echo '```'; tail -c 60000 output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
