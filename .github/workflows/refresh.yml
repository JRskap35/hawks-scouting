# Refreshes stats, rosters, and transactions every other Monday.
# GitHub cron has no "every two weeks", so this runs weekly and skips odd ISO weeks.
# Run it any time by hand from the Actions tab (Run workflow).

name: Biweekly refresh

on:
  schedule:
    - cron: "17 11 * * 1"      # Mondays 11:17 UTC (6:17 AM Eastern)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check week
        id: week
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( 10#$(date +%V) % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Odd week, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.week.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.week.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.week.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Refresh
        if: steps.week.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
        run: python cli.py refresh
