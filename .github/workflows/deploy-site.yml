# Builds the website in web/ and publishes it to GitHub Pages.
# Runs on every push to main that touches web/, and by hand from the Actions tab.
#
# Repo settings needed once:
#   Settings > Pages > Source: GitHub Actions
#   Settings > Secrets and variables > Actions > Variables:
#     SUPABASE_URL        https://xxxx.supabase.co
#     SUPABASE_PUBLISHABLE_KEY   the publishable key, sb_publishable_... (safe to publish, row level security protects the data)
# Without those two variables the site deploys in demo mode with made up players.

name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
